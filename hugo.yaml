# hugo.yaml — Configuration WetAndSeaAI.fr
# Stack : Hugo + PaperMod | Multilangue FR/EN | Build Cloudflare Pages

baseURL: "https://wst-tech.org/"
title: "WST — Wet & Sea Tech"
theme: PaperMod
defaultContentLanguage: fr
defaultContentLanguageInSubdir: false

# ── Multilangue (aligné sur video_language du catalogue) ───────────────────
languages:
  fr:
    label: "Français"
    locale: fr-FR
    weight: 1
    title: "WST — Wet & Sea Tech"
    params:
      description: "La tech qui tient debout — analyses IA, cybersécurité, cloud & DevOps et prospective, par Pascal Froment"
      keywords: ["IA","DevOps","Cybersécurité","Prospective","NotebookLM"]
    menu:
      main:
        - identifier: posts
          name: Articles
          url: /posts/
          weight: 1
        - identifier: themes
          name: Thèmes
          url: /tags/
          weight: 2
        - identifier: about
          name: À propos
          url: /about/
          weight: 3
  en:
    label: "English"
    locale: en-US
    weight: 2
    title: "WST — Wet & Sea Tech"
    params:
      description: "Technology that stands — analyses on AI, cybersecurity, cloud & DevOps and foresight, by Pascal Froment"
    menu:
      main:
        - identifier: posts
          name: Posts
          url: /en/posts/
          weight: 1
        - identifier: tags
          name: Topics
          url: /en/tags/
          weight: 2
        - identifier: about
          name: About
          url: /en/about/
          weight: 3

# ── Taxonomies (alignées sur theme catalogue) ──────────────────────────────
taxonomies:
  tag: tags
  category: categories
  series: series

# ── PaperMod params ────────────────────────────────────────────────────────
params:
  env: production
  # Code du compte goatcounter.com → https://wsttechorg.goatcounter.com/
  # Toute valeur non vide active DEUX partials : le script de comptage dans
  # extend_head.html et le compteur de vues des articles dans extend_footer.html.
  # Ne jamais y laisser un placeholder : il serait truthy et enverrait chaque page
  # vers un sous-domaine inexistant (cas rencontré le 2026-08-08 avec "VOTRE_CODE").
  goatcounterCode: "wsttechorg"
  author: Pascal Froment
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false        # désactivé : moins de bruit
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: false
  comments: false
  hideMeta: false
  socialIcons:
    - name: youtube
      url: "https://www.youtube.com/@wetseatech"
    - name: spotify
      url: "https://open.spotify.com/show/0oYaiUgc05GR03ERhV9uEr"
    - name: rss
      url: "/index.xml"

  # Image OpenGraph par défaut (à remplacer)
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
    responsiveImages: true    # 2026-05-12 — covers locaux dans static/covers/ → srcset auto 360/480/720/1080/1500w via Hugo image processing (gain ~70% poids listing pages mobile)

  # Recherche client-side via Fuse.js (futur)
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title","permalink","summary","content"]

# ── Markup (Goldmark + chroma) ─────────────────────────────────────────────
markup:
  goldmark:
    renderer:
      unsafe: true   # autorise <iframe> YouTube dans les articles
  highlight:
    style: github-dark
    lineNos: false
    codeFences: true
    guessSyntax: true

# ── Outputs ────────────────────────────────────────────────────────────────
outputs:
  home: ["HTML","RSS","JSON"]   # JSON pour la recherche Fuse.js future
  page: ["HTML"]
  section: ["HTML","RSS"]

# ── Pagination ─────────────────────────────────────────────────────────────
pagination:
  pagerSize: 12

# ── Permalinks ─────────────────────────────────────────────────────────────
permalinks:
  posts: /:year/:month/:slug/

# ── Build performance ──────────────────────────────────────────────────────
buildDrafts: false
buildFuture: false
buildExpired: false
enableRobotsTXT: true
enableEmoji: true
