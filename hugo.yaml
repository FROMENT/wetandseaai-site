# hugo.yaml — Configuration WetAndSeaAI.fr
# Stack : Hugo + PaperMod | Multilangue FR/EN | Build Cloudflare Pages

baseURL: "https://wetandseaai-site.pascal-froment.workers.dev/"
title: "Wet & Sea & IA"
theme: PaperMod
defaultContentLanguage: fr
defaultContentLanguageInSubdir: false

# ── Multilangue (aligné sur video_language du catalogue) ───────────────────
languages:
  fr:
    languageName: "Français"
    languageCode: fr-FR
    weight: 1
    title: "Wet & Sea & IA"
    params:
      description: "Veille IA, DevOps, Cybersécurité et Prospective — par Pascal Froment"
      keywords: ["IA","DevOps","Cybersécurité","Prospective","NotebookLM"]
    menu:
      main:
        - identifier: posts
          name: Articles
          url: /posts/
          weight: 1
        - identifier: themes
          name: Thèmes
          url: /tags/
          weight: 2
        - identifier: about
          name: À propos
          url: /about/
          weight: 3
  en:
    languageName: "English"
    languageCode: en-US
    weight: 2
    title: "Wet & Sea & AI"
    params:
      description: "AI, DevOps, Cybersecurity and Foresight — by Pascal Froment"
    menu:
      main:
        - identifier: posts
          name: Posts
          url: /en/posts/
          weight: 1
        - identifier: tags
          name: Topics
          url: /en/tags/
          weight: 2

# ── Taxonomies (alignées sur theme catalogue) ──────────────────────────────
taxonomies:
  tag: tags
  category: categories
  series: series

# ── PaperMod params ────────────────────────────────────────────────────────
params:
  env: production
  author: Pascal Froment
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false        # désactivé : moins de bruit
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: false
  comments: false
  hideMeta: false
  socialIcons:
    - name: youtube
      url: "https://www.youtube.com/@wetandseaai"
    - name: rss
      url: "/index.xml"

  # Image OpenGraph par défaut (à remplacer)
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
    responsiveImages: true

  # Recherche client-side via Fuse.js (futur)
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title","permalink","summary","content"]

# ── Markup (Goldmark + chroma) ─────────────────────────────────────────────
markup:
  goldmark:
    renderer:
      unsafe: true   # autorise <iframe> YouTube dans les articles
  highlight:
    style: github-dark
    lineNos: false
    codeFences: true
    guessSyntax: true

# ── Outputs ────────────────────────────────────────────────────────────────
outputs:
  home: ["HTML","RSS","JSON"]   # JSON pour la recherche Fuse.js future
  page: ["HTML"]
  section: ["HTML","RSS"]

# ── Pagination ─────────────────────────────────────────────────────────────
pagination:
  pagerSize: 12

# ── Permalinks ─────────────────────────────────────────────────────────────
permalinks:
  posts: /:year/:month/:slug/

# ── Build performance ──────────────────────────────────────────────────────
buildDrafts: false
buildFuture: false
buildExpired: false
enableRobotsTXT: true
enableEmoji: true
