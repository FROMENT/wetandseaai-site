<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-ia-travail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a085"/>
      <stop offset="100%" stop-color="#0a3a2e"/>
    </linearGradient>
    <radialGradient id="halo-ia-travail" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#48c9b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#48c9b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-ia-travail" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond dégradé thématique -->
  <rect width="1920" height="1080" fill="url(#bg-ia-travail)"/>

  <!-- Halo lumineux décalé -->
  <ellipse cx="1300" cy="500" rx="700" ry="450" fill="url(#halo-ia-travail)"/>

  <!-- Lignes décoratives diagonales -->
  <g stroke="#48c9b0" stroke-opacity="0.12" stroke-width="2" fill="none">
    <line x1="0" y1="900" x2="1920" y2="180"/>
    <line x1="0" y1="1050" x2="1920" y2="330"/>
    <line x1="0" y1="1200" x2="1920" y2="480"/>
  </g>

  <!-- Icône emoji géant (semi-transparent) -->
  <text x="220" y="640" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif"
        font-size="340" opacity="0.85" filter="url(#shadow-ia-travail)">
    🤖
  </text>

  <!-- Label thème principal -->
  <text x="600" y="540" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="120" font-weight="700" fill="#ffffff"
        filter="url(#shadow-ia-travail)">
    IA & Travail
  </text>

  <!-- Sous-titre branding -->
  <text x="600" y="640" font-family="Inter, -apple-system, sans-serif"
        font-size="48" font-weight="400" fill="#48c9b0" opacity="0.95">
    Wet & Sea AI · wetandseaai.fr
  </text>

  <!-- Tag thème en bas à droite -->
  <rect x="1620" y="980" width="280" height="60" rx="30"
        fill="#000000" fill-opacity="0.35"/>
  <text x="1760" y="1020" font-family="Inter, sans-serif" font-size="28"
        font-weight="600" fill="#ffffff" text-anchor="middle">
    #IA-TRAVAIL
  </text>
</svg>
